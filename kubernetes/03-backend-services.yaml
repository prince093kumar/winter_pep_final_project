---
# Auth Service
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  ports:
    - port: 5001
  selector:
    app: auth-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          # Replace prince093kumar with actual username before applying
          image: prince093kumar/micro-chat-auth-service:latest
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              value: "5001"
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: chat-app-config
                  key: MONGO_URI_AUTH
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-app-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              value: "24h"

---
# Chat Service
apiVersion: v1
kind: Service
metadata:
  name: chat-service
spec:
  ports:
    - port: 5002
  selector:
    app: chat-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: prince093kumar/micro-chat-chat-service:latest
          ports:
            - containerPort: 5002
          env:
            - name: PORT
              value: "5002"
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: chat-app-config
                  key: MONGO_URI_CHAT
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: chat-app-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: chat-app-config
                  key: REDIS_PORT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-app-secret
                  key: JWT_SECRET
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: chat-app-config
                  key: AUTH_SERVICE_URL

---
# Notification Service
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  ports:
    - port: 5003
  selector:
    app: notification-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: prince093kumar/micro-chat-notification-service:latest
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: chat-app-config
                  key: MONGO_URI_NOTIFICATION
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: chat-app-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: chat-app-config
                  key: REDIS_PORT
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: chat-app-config
                  key: AUTH_SERVICE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-app-secret
                  key: JWT_SECRET
